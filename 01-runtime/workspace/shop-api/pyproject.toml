[project]
name = "shop-api"
version = "0.1.0"
description = "Small FastAPI shop API used as the target repo for devagent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
