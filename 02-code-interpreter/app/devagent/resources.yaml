model_id: us.amazon.nova-pro-v1:0
code_interpreter:
  # The AWS-managed interpreter runs in sandbox network mode. A custom interpreter's ID goes here instead.
  identifier: aws.codeinterpreter.v1
  session_timeout_seconds: 1800
  python: python3
  # Modules that must already import in the sandbox. The sandbox has no network, so pip cannot add any.
  packages: [fastapi, httpx]
  # Modules copied from this container into the sandbox at start: pytest and its pure-Python dependencies.
  upload_packages: [pytest, _pytest, pluggy, iniconfig, packaging, py]
  # Try pip install for a missing module. It needs a custom interpreter with public network access.
  install_missing: false
