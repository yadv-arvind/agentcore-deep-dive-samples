[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devagent"
version = "0.1.0"
description = "Spec-first coding agents on AgentCore Runtime, built with Strands Agents"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.58.1, < 1.63",
    "pydantic >= 2.13.5",
    "pyyaml >= 6.0.3",
    "python-dotenv >= 1.2.4",
    # Never run here. sandbox.py uploads pytest's files to the Code Interpreter sandbox, which has no network.
    # The cap matters: agentcore package ignores uv.lock, and sandbox.py's pygments stubs fit this version.
    "pytest >= 9.2, < 9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
